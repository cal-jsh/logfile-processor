[package]
name = "logfile_processor"
version = "0.5.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.8"
tower-http = { version = "0.5.1", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# literal pre-check of filter regexes (same version the regex crate uses)
regex-syntax = "0.8"
tracing = "0.1"
once_cell = "1.18"
uuid = { version = "1.4", features = ["v4"] }

# OpenAPI schema annotations on the models (kept for now; nothing serves them)
utoipa = "5.2"
memmap2 = "0.9"
memchr = "2"
rayon = "1"
